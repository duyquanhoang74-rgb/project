<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>User management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
<link rel="stylesheet" href="../css/reset.css" /><link rel="stylesheet" href="../css/dashboard.css" /><link rel="icon" type="image/png" href="../assets/images/trello-favicon.png" /></head>
<body>
<header id="header"><div class="dashboard-logo"><img src="../assets/images/dashboard-logo.png" alt="Trello" /></div><div class="dashboard-header-empty"></div></header>
<div id="body-container">
    <nav id="side-container">
      <p class="side-container-title">Your dashboard</p>
      <div class="dashboard-list"><img src="../assets/icons/user-dashboard-icon.png" alt="" /><a href="./dashboard.html">User management</a></div>
      <div class="dashboard-list"><img src="../assets/icons/add-new-user-icon.png" alt="" /><a href="./add-user.html">Add user</a></div>
      <div class="dashboard-list sign-out"><img src="../assets/icons/sign-out-icon.png" alt="" /><a id="sign-out">Sign out</a></div>
    </nav>
    <main id="main">
      <div class="main-title-div"><i class="fa-solid fa-bars"></i><h2>User management</h2></div>
      <div class="search-div"><input id="search-box" type="text" placeholder="Search by name" /><i class="fa-solid fa-magnifying-glass" id="search-btn"></i></div>
      <div id="user-table-container">
        <table>
          <thead><tr><th>User code</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="user-tbody"></tbody>
        </table>
      </div>
      <div id="pagination">
        <div class="pagination-element" id="prev-page"><i class="fa-solid fa-angle-left"></i></div>
        <ul id="pagination-list"></ul>
        <div class="pagination-element" id="next-page"><i class="fa-solid fa-angle-right"></i></div>
      </div>
    </main>
</div>
<script src="../js/common.js"></script><script src="../js/dashboard.js"></script>
</body></html>
