<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Sign in</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
<link rel="stylesheet" href="../css/reset.css" /><link rel="stylesheet" href="../css/sign-in.css" /><link rel="icon" type="image/png" href="../assets/images/trello-favicon.png" /></head>
<body>
<div id="msg">
  <div id="login-validation" class="hidden">
    <div class="login-validation-header"><i class="fa-solid fa-circle-minus"></i><p>Please fix the following</p><span class="close-btn"><img src="../assets/icons/close.png" alt="close" /></span></div>
    <div class="login-validation-content" data-content></div>
  </div>
  <div id="login-toast" class="hidden"><i class="fa-solid fa-circle-check"></i><span class="toast-title" data-content></span></div>
  <div id="login-error" class="hidden"><i class="fa-solid fa-circle-exclamation"></i><span class="error-title" data-content></span></div>
</div>
<main class="sign-in-main">
  <img class="logo" src="../assets/images/logo.png" alt="Trello" />
  <p class="sign-in-message">Please sign in</p>
  <form id="sign-in-form" novalidate>
    <input type="email" id="email" placeholder="Email address" />
    <input type="password" id="password" placeholder="Password" />
    <label class="save-loggin"><input type="checkbox" id="save-loggin-checkbox" />Remember me</label>
    <p>Don't have an account? <a class="signup-link" href="./sign-up.html">Sign up</a></p>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="sign-in-footer">&copy; 2025 - Rikkei Education</p>
</main>
<script src="../js/common.js"></script><script src="../js/sign-in.js"></script>
</body></html>
